<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}
body{font-family:"Arial Rounded MT Bold","Avenir Next",-apple-system,system-ui,"PingFang HK","Noto Sans CJK TC",sans-serif;color:#24344d;
 background:linear-gradient(180deg,#7fd0ff 0%,#d6f3ff 72%,#a5e887 72%,#7cd65a 100%)}
button{font:inherit;border:0;margin:0;padding:0;background:none;color:inherit;cursor:pointer;outline:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;
 padding:calc(env(safe-area-inset-top) + 2vmin) calc(env(safe-area-inset-right) + 2vmin) calc(env(safe-area-inset-bottom) + 2vmin) calc(env(safe-area-inset-left) + 2vmin)}
.screen.on{display:flex}
.big{border-radius:5vmin;box-shadow:0 1.2vmin 0 rgba(0,0,0,.18);transition:transform .1s}
.big:active{transform:translateY(.6vmin) scale(.97)}
/* language picker */
#lang{justify-content:center;align-items:center;gap:4vmin}
#lang .logo{font-size:11vmin;line-height:1}
.langs{display:flex;gap:4vmin;justify-content:center;align-items:center}
.langbtn{width:min(29vw,46vmin);height:min(40vh,42vmin);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;color:#fff;text-shadow:0 .4vmin 0 rgba(0,0,0,.25)}
.langbtn .flag{font-size:14vmin;line-height:1}
.langbtn .lbl{font-size:6.5vmin;font-weight:900}
.l-en{background:#ff6b6b}.l-ru{background:#4dabf7}.l-yue{background:#f59f00}
@media (orientation:portrait){.langs{flex-direction:column}.langbtn{width:72vw;height:22vh;flex-direction:row;gap:5vw}}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;height:12vmin;flex:none}
.round{width:11vmin;height:11vmin;border-radius:50%;background:#fff;font-size:6.5vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 .8vmin 0 rgba(0,0,0,.15);position:relative}
.ttl{font-size:5vmin;font-weight:900;color:#fff;text-shadow:0 .4vmin 0 rgba(0,0,0,.25);text-align:center;flex:1}

.piwaves.w2{animation-duration:23s;animation-direction:reverse;opacity:.6;background-position:120px 60px}
@keyframes piwave{from{transform:translate3d(0,0,0)}to{transform:translate3d(-400px,0,0)}}
.islpos{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.islbob{position:relative;animation:pibob 5s ease-in-out infinite;will-change:transform}
@keyframes pibob{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
.islbg{position:absolute;left:0;top:0;display:block}
.ped{position:absolute;width:260px;height:330px;display:block}
.ped .pobj{position:absolute;left:20px;top:0;width:220px;height:220px;z-index:2;animation:pifloat 3.2s ease-in-out infinite;will-change:transform;pointer-events:none}
.ped .pobj svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.ped .pbase{position:absolute;left:0;top:186px;width:260px;height:120px;pointer-events:none}
.ped .pbase svg{width:100%;height:100%;display:block}
.ped.press .pobj svg{transform:scale(.94)}
.ped .pnew{position:absolute;right:6px;top:4px;width:62px;height:62px;z-index:3;border-radius:50%;background:#ff595e;border:5px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;animation:pipulse 1.6s ease-in-out infinite}
@keyframes pifloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pipulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.pibnc{animation:pibnc .45s}
@keyframes pibnc{0%,100%{scale:1}40%{scale:1.15}}
/* shared game area */
.piarea{flex:1;position:relative;min-height:0;overflow:hidden;border-radius:4vmin;touch-action:none;box-shadow:inset 0 0 0 .6vmin rgba(255,255,255,.5)}
.piarea>svg.piscn{position:absolute;display:block;z-index:1}
.pipc{position:absolute;left:0;top:0;z-index:5;will-change:transform;touch-action:none;cursor:grab}
.pipc>svg,.pipc>.pin>svg{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 .8vmin 0 rgba(0,0,0,.18))}
.pipc.card{background:#fff;border-radius:22%;box-shadow:0 1vmin 0 rgba(0,0,0,.16)}
.pipc.card>svg{width:78%;height:78%;margin:11%;filter:none}
.pipc.pidrag>svg,.pipc.pidrag>.pin>svg{filter:drop-shadow(0 2vmin .6vmin rgba(0,0,0,.25))}
.pipc.gone{display:none}
.pitray{position:absolute;border-radius:3.5vmin;z-index:1}
.pitray.wood{background:linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px) 0 0/40px 100%,#e9b872;border:1vmin solid #a0673a;box-shadow:inset 0 0 0 .5vmin #f5d29c}
.piwig{animation:cwwig .5s}
.pihint{animation:cwpulse 1s ease-in-out 3}
.pipop{animation:pipop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pipop{from{scale:.2;opacity:0}to{scale:1;opacity:1}}
.pibubble{position:absolute;z-index:8;background:#fff;border-radius:4vmin;padding:1vmin 2.4vmin;font-weight:900;color:#2b2d42;box-shadow:0 .8vmin 0 rgba(0,0,0,.15);display:flex;align-items:center;gap:1vmin;pointer-events:none}
/* magic hat */
.piarea.hat{background:radial-gradient(ellipse at 50% 120%,#8f5cf7 0%,#5a2fb3 45%,#2c1468 100%)}
.picurt{position:absolute;top:0;bottom:0;width:15%;z-index:0;pointer-events:none}
.picurt svg{width:100%;height:100%;display:block}
.picurt.l{left:0}.picurt.r{right:0;transform:scaleX(-1)}
.pibunny{transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
/* scene puzzle */
.piarea.scene{background:#9be7ff}
.piarea.scene.farm{background:#a5e3ff}
.piarea.scene.street{background:#bde9ff}
.alive .scobj{animation:pibob 2.4s ease-in-out infinite}
/* shopping */
.piarea.cart{background:linear-gradient(180deg,#fff4e0 0 70%,#f6d8a8 70% 100%)}
.pishelf{position:absolute;z-index:1;border-radius:2.5vmin;background:#ffe8cc;border:1vmin solid #c2803f}
.pishelf i{position:absolute;left:0;right:0;height:2.2vmin;background:#c2803f;border-top:.5vmin solid #a0673a}
.picartb,.picartf{position:absolute;pointer-events:none}
.picartb{z-index:2}.picartf{z-index:4}
.picartb svg,.picartf svg{width:100%;height:100%;display:block}
.pinc{position:absolute;z-index:3;pointer-events:none}
.pinc svg{width:100%;height:100%;display:block}
.picount{position:absolute;z-index:9;min-width:16vmin;height:16vmin;border-radius:8vmin;background:#ffd43b;border:1vmin solid #fff;box-shadow:0 1vmin 0 rgba(0,0,0,.18);font-size:10vmin;font-weight:900;color:#2b2d42;display:flex;align-items:center;justify-content:center;padding:0 2vmin;pointer-events:none}
/* dress up */
.piarea.dress{background:repeating-linear-gradient(90deg,#d3f9d8 0 6vmin,#ebfbee 6vmin 12vmin)}
.piarea.dress::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:#e3a35f;border-top:1vmin solid #c2803f;z-index:0}
.pikid{position:absolute;z-index:2}
.pikid svg{width:100%;height:100%;display:block}
.pikid.jump{animation:pijump .6s ease-in-out 2}
@keyframes pijump{0%,100%{transform:translateY(0)}50%{transform:translateY(-8%)}}
.pitray.ward{background:#ffe8cc;border:1.4vmin solid #a0673a;box-shadow:inset 0 2.4vmin 0 #c2803f}
/* fish bowl */
.piarea.fish{background:linear-gradient(180deg,#e7f5ff 0 72%,#d0bfff 72% 100%)}
.pitray.pond{background:radial-gradient(ellipse at 50% 40%,#74c0fc 0%,#339af0 70%,#1c7ed6 100%);border:1vmin solid #2b8a3e;box-shadow:inset 0 0 0 1vmin #8ce99a}
.pibowl{position:absolute;z-index:2;pointer-events:none}
.pibowl svg{width:100%;height:100%;display:block}
.pibowlfront{z-index:4}
.pibf{position:absolute;z-index:3;pointer-events:none}
.pibf>div{width:100%;height:100%;animation:piswim 3s ease-in-out infinite alternate}
.pibf.flip>div{animation-name:piswim2}
.pibf svg{width:100%;height:100%;display:block}
.pibf.lit>div>svg{filter:drop-shadow(0 0 1.4vmin #fff700) drop-shadow(0 0 .6vmin #fff)}
@keyframes piswim{from{transform:translateX(-14%) translateY(4%)}to{transform:translateX(14%) translateY(-4%)}}
@keyframes piswim2{from{transform:scaleX(-1) translateX(-14%)}to{transform:scaleX(-1) translateX(14%) translateY(-4%)}}
.pipc.swim>.pin{width:100%;height:100%;animation:pisway 1.8s ease-in-out infinite alternate}
@keyframes pisway{from{transform:rotate(-6deg)}to{transform:rotate(6deg) translateY(-6%)}}
.pinb{position:absolute;z-index:2;pointer-events:none;display:flex;align-items:flex-end;justify-content:center}
.pinb svg{height:100%;width:auto;max-width:100%}
.pitgt{position:absolute;z-index:6;border-radius:50%;background:#ffd43b;border:1vmin solid #fff;box-shadow:0 1vmin 0 rgba(0,0,0,.18);font-weight:900;color:#2b2d42;display:flex;align-items:center;justify-content:center;pointer-events:none}
.pinum{position:absolute;z-index:5;border-radius:24%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;text-shadow:0 .6vmin 0 rgba(0,0,0,.25);box-shadow:0 1vmin 0 rgba(0,0,0,.18);border:.8vmin solid #fff}
/* treasure chest */
.piarea.chest{background:linear-gradient(180deg,#8be0ff 0 38%,#2bb3e6 38% 52%,#ffe29a 52% 100%)}
.pichest{position:absolute;z-index:3}
.pichest .cb,.pichest .cl{position:absolute;left:0;width:100%}
.pichest .cb{bottom:0;height:66%;z-index:2}
.pichest .cl{top:0;height:40%;z-index:3;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.pichest.open .cl{transform:translateY(-34%) rotate(-14deg)}
.pichest svg{width:100%;height:100%;display:block}
.pichest .tr{position:absolute;left:10%;width:80%;top:20%;height:60%;z-index:1;display:flex;align-items:center;justify-content:center;line-height:1;opacity:0;transform:translateY(30%) scale(.3);transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.pichest.open .tr{opacity:1;transform:translateY(-62%) scale(1);z-index:4}
/* animal tree */
.piarea.tree{background:linear-gradient(180deg,#a5e3ff 0 80%,#79c84a 80% 100%)}
.pispot{position:absolute;z-index:3}
.pispot .ta{position:absolute;left:12%;top:0;width:76%;height:76%;z-index:1;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .25s;transform:translateY(40%) scale(.3);opacity:0;pointer-events:none}
.pispot.peek .ta{transform:translateY(-6%) scale(.92);opacity:1}
.pispot.open .ta{transform:translateY(-46%) scale(1.08);opacity:1}
.pispot .tc{position:absolute;left:0;bottom:0;width:100%;height:62%;z-index:2;pointer-events:none}
.pispot .ta svg,.pispot .tc svg{width:100%;height:100%;display:block}
.pispot.shake .tc{animation:cwwig .6s}
.pispot.found .ta svg{filter:drop-shadow(0 0 1.2vmin #fff700)}
/* easel */
.piarea.easel{background:linear-gradient(180deg,#fff0f6 0 74%,#e3a35f 74% 100%)}
.pieobj{cursor:pointer}
.pibrush{position:absolute;z-index:9;pointer-events:none;width:12vmin;height:12vmin}
.pipot{position:absolute;z-index:5}
.pipot.sel{filter:drop-shadow(0 0 1.4vmin #fff700)}
/* ================= v10 design system: calm, clean, one pastel colour per section ================= */
:root{--navy:#25304f;--ink2:#5b6585;--bg:#fbf6ee;--card:#fff;--r:28px;--sh:0 6px 18px rgba(37,48,79,.10);--sh2:0 3px 8px rgba(37,48,79,.08);
 --coral:#ff8a73;--coralL:#ffe9e3;--sun:#ffc145;--sunL:#fff3d6;--mint:#4fc4a0;--mintL:#e0f5ee;--sky:#5aa9e6;--skyL:#e3f0fb;--lav:#9b87e8;--lavL:#eee9fb;--cream:#f1e7d6;--creamL:#f6efe3;
 --acc:var(--sky);--accL:var(--skyL);--tap:max(88px,11vmin)}
*{text-shadow:none!important}
body{font-family:"Fredoka","Baloo 2",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Avenir Next",-apple-system,system-ui,"PingFang HK","Noto Sans CJK TC",sans-serif!important;
 color:var(--navy)!important;background:var(--bg)!important;transition:background-color .35s}
body[data-sec=coral]{--acc:var(--coral);--accL:var(--coralL);background:#fff4f0!important}
body[data-sec=sun]{--acc:var(--sun);--accL:var(--sunL);background:#fff8e8!important}
body[data-sec=mint]{--acc:var(--mint);--accL:var(--mintL);background:#eefaf5!important}
body[data-sec=sky]{--acc:var(--sky);--accL:var(--skyL);background:#eef6fd!important}
body[data-sec=lav]{--acc:var(--lav);--accL:var(--lavL);background:#f5f2fd!important}
body[data-sec=cream],body[data-sec=hub]{--acc:var(--coral);--accL:var(--coralL);background:var(--bg)!important}
.c-coral{--c:var(--coral);--cl:var(--coralL)}.c-sun{--c:var(--sun);--cl:var(--sunL)}.c-mint{--c:var(--mint);--cl:var(--mintL)}
.c-sky{--c:var(--sky);--cl:var(--skyL)}.c-lav{--c:var(--lav);--cl:var(--lavL)}.c-cream{--c:#d9c6a5;--cl:var(--creamL)}
.screen{background:transparent!important}
.screen::before,.screen::after,#menu.isl::before{display:none!important}
.big{border-radius:var(--r)!important;box-shadow:var(--sh)!important}
.big:active{transform:scale(.97)!important}
.ttl,.q,.lq,.line,.op,.npbig,.rhttl,.rl,.sbtop,.tl,.cwbl,.tile .lbl,.choice,.bt,.wl,.lbl{color:var(--navy)!important;-webkit-text-stroke:0!important;paint-order:normal!important}
/* top bar: home, big task line, hear-it-again */
.top{height:auto!important;min-height:calc(var(--tap) + 16px);gap:20px;padding:4px 6px 10px;position:relative!important;inset:auto!important;z-index:5;background:none!important}
.round{width:var(--tap)!important;height:var(--tap)!important;border-radius:50%!important;background:#fff!important;box-shadow:var(--sh)!important;font-size:0!important;flex:none;border:0!important}
.round>svg:not(.ring){width:48%;height:48%;pointer-events:none}
.round.speak{background:var(--acc)!important}
.round.speak svg path,.round.speak svg rect{fill:#fff;stroke:#fff}
.home svg.ring{inset:-8px!important;width:calc(100% + 16px)!important;height:calc(100% + 16px)!important}
.home svg.ring circle{stroke:var(--acc)!important}
.ttl{font-weight:600!important;font-size:clamp(26px,4.6vmin,56px)!important;line-height:1.15;letter-spacing:.01em;text-align:center;flex:1;min-width:0}
#gameTtl.task{font-size:clamp(28px,5.4vmin,68px)!important;background:#fff;border-radius:var(--r);box-shadow:var(--sh2);padding:10px 26px;min-height:var(--tap);display:flex;align-items:center;justify-content:center}
#gameTtl.task.long{font-size:clamp(24px,4.3vmin,54px)!important}
#gameTtl.task.vlong{font-size:clamp(20px,3.5vmin,44px)!important}
.dup{display:none!important}
/* every menu: white picture cards on the section colour */
#tiles{padding:8px 4px 6px!important;gap:clamp(16px,2.6vmin,34px)!important}
.tile.v10c{background:#fff!important;border-radius:var(--r)!important;box-shadow:var(--sh)!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;
 gap:1.6vmin!important;padding:2vmin!important;position:relative;overflow:hidden;min-height:88px;min-width:0;border:0!important;outline:0!important}
.tile.v10c>*:not(.v10art):not(.lbl):not(.v10badge){display:none!important}
:where(.v10art){--c:var(--acc);--cl:var(--accL)}
.tile.v10c{container-type:size}
.v10art{flex:none;width:min(66cqh,80cqw);height:min(66cqh,80cqw);border-radius:50%;background:var(--cl);display:flex;align-items:center;justify-content:center;pointer-events:none}
@supports not (width:1cqw){.v10art{width:60%;height:auto;aspect-ratio:1}}
.v10art>svg,.v10art>.art{width:70%;height:70%;display:block}
.v10art .emoc{background:none;width:70%;height:70%}
.tile.v10c .lbl{font-size:clamp(22px,3.5vmin,44px)!important;font-weight:600!important;line-height:1.1;text-align:center;padding:0 6px;flex:none}
.v10badge{position:absolute;top:14px;right:16px;display:flex;align-items:center;gap:4px;background:var(--creamL);border-radius:99px;padding:4px 12px 4px 8px;font-size:clamp(16px,2.2vmin,26px);color:var(--ink2);font-weight:600}
.v10badge svg{width:1.2em;height:1.2em}
@keyframes v10press{0%{transform:scale(1)}40%{transform:scale(.95)}100%{transform:scale(1)}}
.v10press{animation:v10press .25s}
/* home: 7 calm destinations, Letters is the big first card */
#tiles.v10hub{display:grid!important;grid-template-columns:1.25fr 1fr 1fr 1fr!important;grid-template-rows:1fr 1fr!important}
#tiles.v10hub .hubc[data-hub=letters]{grid-row:1/3}
#tiles.v10hub .hubc[data-hub=letters] .v10art{width:min(62cqh,84cqw);height:min(62cqh,84cqw)}
#tiles.v10hub .hubc[data-hub=letters] .lbl{font-size:clamp(28px,4.6vmin,58px)!important}
#tiles.v10sec{display:grid!important;grid-template-rows:1fr!important;grid-template-columns:repeat(4,1fr)!important}
#tiles.v10sec.n3{grid-template-columns:repeat(3,1fr)!important}
@media (orientation:landscape){#tiles.v10sec{grid-template-rows:minmax(0,min(100%,62vmin))!important;align-content:center}}
#tiles.v10sec .tile.v10c .lbl{font-size:clamp(24px,3.9vmin,50px)!important}
#tiles.v10grid{display:grid!important}
#tiles.v10grid>.tile{grid-column:auto!important;grid-row:auto!important;width:auto!important;height:auto!important}
.tile.v10c::before,.tile.v10c::after{display:none!important}
#tiles.v10grid.k1,#tiles.v10grid.k2,#tiles.v10grid.k3,#tiles.v10grid.k4{grid-template-rows:1fr!important}
#tiles.v10grid.k2{grid-template-columns:repeat(2,1fr)!important}#tiles.v10grid.k3{grid-template-columns:repeat(3,1fr)!important}#tiles.v10grid.k4{grid-template-columns:repeat(4,1fr)!important}
#tiles.v10grid.k5,#tiles.v10grid.k6{grid-template-columns:repeat(3,1fr)!important;grid-template-rows:1fr 1fr!important}
#tiles.v10grid.k7,#tiles.v10grid.k8{grid-template-columns:repeat(4,1fr)!important;grid-template-rows:1fr 1fr!important}
#tiles.v10grid.k9,#tiles.v10grid.k10,#tiles.v10grid.k11,#tiles.v10grid.k12{grid-template-columns:repeat(4,1fr)!important;grid-template-rows:repeat(3,1fr)!important}
#tiles.v10grid.k9 .lbl,#tiles.v10grid.k10 .lbl,#tiles.v10grid.k11 .lbl,#tiles.v10grid.k12 .lbl{font-size:clamp(18px,2.8vmin,36px)!important}
@media (orientation:portrait){
 #tiles.v10hub{grid-template-columns:1fr 1fr!important;grid-template-rows:1.35fr 1fr 1fr 1fr!important}
 #tiles.v10hub .hubc[data-hub=letters]{grid-row:auto;grid-column:1/3;flex-direction:row!important;gap:4vw!important}
 #tiles.v10hub .hubc[data-hub=letters] .v10art{width:min(84cqh,46cqw);height:min(84cqh,46cqw)}
 #tiles.v10sec{grid-template-columns:1fr 1fr!important;grid-template-rows:1fr 1fr!important}
 #tiles.v10sec.n3{grid-template-columns:1fr 1fr!important}
 #tiles.v10sec.n3>:last-child{grid-column:1/3}
 #tiles.v10grid.k3,#tiles.v10grid.k4{grid-template-columns:1fr 1fr!important;grid-template-rows:1fr 1fr!important}
 #tiles.v10grid.k3>:last-child{grid-column:1/3}
 #tiles.v10grid.k5,#tiles.v10grid.k6{grid-template-columns:1fr 1fr!important;grid-template-rows:repeat(3,1fr)!important}
 #tiles.v10grid.k7,#tiles.v10grid.k8{grid-template-columns:1fr 1fr!important;grid-template-rows:repeat(4,1fr)!important}
 #tiles.v10grid.k7>:first-child{grid-column:1/3}
 #tiles.v10grid.k9,#tiles.v10grid.k10,#tiles.v10grid.k11,#tiles.v10grid.k12{grid-template-columns:repeat(3,1fr)!important;grid-template-rows:repeat(4,1fr)!important}
}
/* game surfaces: white cards, no outlines, no translucent panels */
.card,.lcard,.anb,.bra,.choice,.sub,.tool,.arw,.bigl,.thc,.npk,.opt,.cwopt,.stk,.pzpic,.cwnext,.cwsb,.play2,.ear{background:#fff!important;border:0!important;outline:0!important;box-shadow:var(--sh)!important;color:var(--navy)!important}
.card,.lcard,.anb,.bra{border-radius:var(--r)!important}
.sub.on,.tool.on{box-shadow:0 0 0 5px var(--acc),var(--sh)!important}
.right{box-shadow:0 0 0 6px var(--mint),var(--sh)!important}
.sub svg,.tool svg,.ear svg,.arw svg,.cwnext svg,.cwsb svg,.play2 svg{pointer-events:none}
.sub>svg{height:60%!important;width:auto}
.ear svg{width:55%;height:55%}
.ear{background:var(--acc)!important}.ear svg path{fill:#fff;stroke:#fff}
.arw{width:var(--tap)!important;height:var(--tap)!important;border-radius:50%!important;display:flex;align-items:center;justify-content:center;font-size:0!important;flex:none}
.arw svg{width:46%;height:46%}
.play2 svg,.cwnext svg,.cwsb svg{width:52%;height:52%}
.bjoin,.board,.shopbox,.piarea,.rhbox,.cwbox,.sbgrid,.lmwrap,.lfwrap{background:rgba(255,255,255,.7)!important;box-shadow:none!important;outline:0!important;border:0!important}
.piarea::before,.piarea::after{display:none!important}
.art{display:block;width:78%;height:78%;margin:auto;pointer-events:none}
.card .art{width:80%;height:80%}
.lcard .art{width:62%;height:62%;flex:1 1 auto;min-height:0}
.emoc{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--accL);line-height:1;pointer-events:none}
.emoc .emo{font-size:.72em;line-height:1}
.card .emoc,.anb .emoc{width:78%;height:78%;font-size:calc(var(--s,24vmin)*.5)}
.lcard .emoc{flex:0 1 auto;height:62%;width:auto;aspect-ratio:1;min-height:0;font-size:min(13vmin,120px)}
.thc .art,.be .art,.popin .art,.e1 .art{width:1.25em;height:1.25em;display:inline-block}
.en .art{width:1.1em;height:1.1em;display:inline-block;margin:0 .05em}
.lgot .popin{display:inline-flex;width:9vmin;height:9vmin}
.lgot .popin .art{width:100%;height:100%}

const SP = { voice: null, canSpeak: true, gen: 0 };

  let vs = []; try { vs = speechSynthesis.getVoices() || []; } catch (e) {}
  if (!vs.length) { SP.voice = null; SP.canSpeak = true; showNote(false); return; } // list not loaded yet: let the OS choose by lang code
  let best = null, bs = -1e9;

    const vl = normLang(v.lang);
    const idx = L.match.findIndex(m => vl === m || vl.startsWith(m + '-'));
    if (idx < 0) continue;
    let s = 100 - idx * 10 + (v.localService ? 3 : 0) + (/enhanced|premium|neural|natural/i.test(v.name) ? 6 : 0) + (L.prefer.test(v.name) ? 4 : 0) - (NOVELTY.test(v.name) ? 80 : 0);

function ttsSay(text, opt = {}) {

    const g = SP.gen; let done = false, to;
    const fin = () => { if (done) return; done = true; clearTimeout(to); res(g === SP.gen); };
    const per = L.key === 'yue' ? 230 : 75;
    const est = 500 + text.length * per / (opt.rate || 1);
    if (!SP.canSpeak || !hasTTS()) { to = setTimeout(fin, Math.min(est, 2500)); return; }
    to = setTimeout(fin, est + 3000); // safety net if onend never fires

  });

const PAL = ['#ff6b6b','#ffd43b','#69db7c','#4dabf7','#da77f2','#ffa94d','#fff'];
function confetti(n = 40) {
  const fx = $('#fx'), W = innerWidth, H = innerHeight;
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'cf';
    if (Math.random() < 0.45) { d.textContent = pick(['⭐','🌟','✨']); d.style.fontSize = (3 + Math.random() * 4) + 'vmin'; }
    else { const s = (1.2 + Math.random() * 1.8) + 'vmin'; d.style.width = s; d.style.height = s; d.style.background = pick(PAL); d.style.borderRadius = Math.random() < 0.5 ? '50%' : '20%'; }
    d.style.left = (W / 2) + 'px'; d.style.top = (H * 0.55) + 'px'; fx.appendChild(d);
    const a = Math.random() * Math.PI * 2, dist = H * (0.2 + Math.random() * 0.45);
    const dx = Math.cos(a) * dist * 1.4, dy = Math.sin(a) * dist - H * 0.15;
    try {
      const an = d.animate([
        { transform: 'translate(0,0) scale(.3) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) scale(1) rotate(${rnd(360)}deg)`, opacity: 1, offset: 0.65 },
        { transform: `translate(${dx}px,${dy + H * 0.2}px) scale(.8) rotate(${rnd(720)}deg)`, opacity: 0 }
      ], { duration: 1300 + rnd(800), easing: 'cubic-bezier(.2,.7,.3,1)' });
      an.onfinish = () => d.remove();
    } catch (e) { setTimeout(() => d.remove(), 1500); }
  }
}

    Array.from({ length: n }, (_, i) => `<button class="carbtn" data-i="${i}"><span class="badge"></span>${carSVG(cols[i % cols.length])}</button>`).join('')
  }</div><div class="choices">${choices.map((c, i) => `<button class="choice big" data-v="${c}" style="background:${['#ff922b','#20c997','#845ef7'][i]}">${c}</button>`).join('')}</div>`;

/* ---------- Nursery rhymes (Web Audio melody + spoken words) ---------- */
const NOTE_IX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function parseNotes(s) { return s.trim().split(/\s+/).map(tk => { const [n, b] = tk.split(':'), m = /^([A-G])(#|b)?(\d)$/.exec(n);
  if (!m) throw new Error('bad note ' + tk); const midi = 12 * (+m[3] + 1) + NOTE_IX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return [440 * Math.pow(2, (midi - 69) / 12), +b]; }); }
const RH = { song: -1, line: 0, playing: false, tune: false, tok: 0, gain: null };

  const c = ac(); if (!c) return; const t = c.currentTime + t0;

    const o = c.createOscillator(), gn = c.createGain(); o.type = m === 1 ? 'triangle' : 'sine'; o.frequency.value = f * m;
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol * v, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(1.1, 0.25 + dur * 0.9));
    o.connect(gn); gn.connect(dest); o.start(t); o.stop(t + 1.2);
  }
}
function startRhymes(g) { RH.song = -1; rhList(g); say(L.rhymes.hello); }
function rhStop() { RH.tok++; RH.playing = false; stopSpeech(); if (RH.gain) { try { RH.gain.disconnect(); } catch (e) {} RH.gain = null; } }
function rhList(g) {
  rhStop(); RH.song = -1;
  const st = $('#stage');
  st.innerHTML = `<div class="rhgrid">${L.rhymes.list.map((s, i) => `<button class="rhtile big" data-i="${i}"><span class="ri">${s.icon}</span><span class="rt">${s.title}</span></button>`).join('')}</div>`;
  st.querySelectorAll('.rhtile').forEach(b => tap(b, () => { anim(b, 'bounce'); SFX.pop(); rhOpen(g, +b.dataset.i, true); }));

}

    <div class="rhpic" id="rhpic"></div><div class="rhlyr" id="rhlyr">${s.lines.map((l, k) => `<div class="rl" data-k="${k}">${l.t}</div>`).join('')}</div>
    <div class="rhctl"><button class="play2 big" id="rhplay">${ICON.play}</button><button class="sub big" id="rhnext">${ICON.right}</button></div>`;
  tap($('#rhback'), () => { SFX.pop(); rhList(g); });
  tap($('#rhmode'), () => { RH.tune = !RH.tune; $('#rhmode').textContent = RH.tune ? '🎹' : '🗣️'; anim($('#rhmode'), 'bounce'); SFX.pop(); if (RH.playing) { rhStop(); rhPlay(g); } });

function rhUi() { const b = $('#rhplay'); if (b) b.innerHTML = RH.playing ? ICON.pause : ICON.play; }
function rhShowLine() {

  document.querySelectorAll('.rl').forEach(e => { const k = +e.dataset.k; e.classList.toggle('now', k === RH.line); e.style.display = Math.abs(k - RH.line) <= 1 ? '' : 'none'; });

  const c = ac(); RH.playing = true; rhUi(); const tok = ++RH.tok;
  if (c) { RH.gain = c.createGain(); RH.gain.gain.value = 1; RH.gain.connect(MASTER); }
  const s = L.rhymes.list[RH.song], spb = 60 / s.bpm;

/* ---------- Thinking games: what comes next, odd one out, big/small, number sequences ---------- */
const TH = { busy: false, last: '', tok: 0, prompt: '' };
const thPool = cat => VOCAB[cat].map(([id, e]) => ({ id, e, nm: L.words[id].name.replace(/!$/, '').toLowerCase() }));
function startThink(g) { thRound(g); }
function thRound(g) {
  if (g !== scene) return;
  const tok = ++TH.tok; TH.busy = false;
  let type; do { type = pick(['pattern', 'odd', 'size', 'seq']); } while (type === TH.last); TH.last = type;
  const cats = shuffle(['animals', 'transport', 'food']);
  let row = '', opts = [], prompt, sayP, yes;
  if (type === 'pattern') {
    const it = opt3(thPool(cats[0]), 4), kind = pick(['AB', 'AAB', 'ABC']);
    const seq = kind === 'AB' ? [0, 1, 0, 1, 0] : kind === 'AAB' ? [0, 0, 1, 0, 0] : [0, 1, 2, 0, 1];
    const ans = kind === 'AB' ? 1 : kind === 'AAB' ? 1 : 2;
    row = seq.map(k => `<span class="thc">${vpic(it[k].e)}</span>`).join('') + `<span class="thc q" id="thq">?</span>`;
    const pool = [ans, ...[0, 1, 2, 3].filter(k => k !== ans)].slice(0, 3);
    opts = shuffle(pool.map(k => ({ h: it[k].e, ok: k === ans })));
    prompt = sayP = L.think.next; yes = pick(L.praise);
  } else if (type === 'odd') {
    if (Math.random() < 0.5) { const [a, b] = opt3(thPool(cats[0]), 2); opts = shuffle([a, a, a, b].map(x => ({ h: x.e, ok: x === b }))); yes = L.think.oddYes(b.nm); }
    else { const s = opt3(thPool(cats[0]), 3), b = pick(thPool(cats[1])); opts = shuffle([...s, b].map(x => ({ h: x.e, ok: x === b }))); yes = L.think.oddYes(b.nm); }
    prompt = sayP = L.think.odd;
  } else if (type === 'size') {
    const it = pick(thPool(cats[0])), big = Math.random() < 0.5;
    opts = shuffle([1, 0.62, 0.34].map((sc, k) => ({ h: `<span style="font-size:${sc}em">${it.e}</span>`, ok: big ? k === 0 : k === 2 })));
    prompt = sayP = big ? L.think.big : L.think.small; yes = big ? L.think.bigYes : L.think.smallYes;
  } else {
    const s = 1 + rnd(6), a = s + 3;
    row = [s, s + 1, s + 2].map(n => `<span class="thc num">${n}<i>${'•'.repeat(n)}</i></span>`).join('') + `<span class="thc q" id="thq">?</span>`;
    const others = shuffle([s, s + 1, s + 2, s + 4, s + 5].filter(n => n !== a && n <= 10)).slice(0, 2);
    opts = shuffle([a, ...others].map(n => ({ h: `<span class="numo">${n}</span>`, ok: n === a, n })));
    prompt = L.think.seq; sayP = L.think.seqSay(s); yes = cap(L.nums[a]) + '! ' + pick(L.praise);
  }
  TH.prompt = sayP;
  const st = $('#stage');
  st.innerHTML = `<div class="q">${prompt}</div>${row ? `<div class="throw">${row}</div>` : ''}<div class="opts thopts n${opts.length}">${opts.map((o, i) => `<button class="card big" data-i="${i}">${vpic(o.h, 'emo')}</button>`).join('')}</div>`;
  st.querySelectorAll('.thopts .card').forEach(b => tap(b, () => thTap(g, tok, opts[+b.dataset.i], b, yes)));
  TH.opts = opts;
  repeatFn = () => say(TH.prompt);
  say(sayP);
}
async function thTap(g, tok, o, b, yes) {
  if (TH.busy || tok !== TH.tok) return;
  if (!o.ok) { anim(b, 'wiggle'); SFX.boop(); stopSpeech(); say(pick(L.retry)); return; }
  TH.busy = true; b.classList.add('right'); anim(b, 'bounce'); cheer(); stopSpeech();
  const q = $('#thq'); if (q) { q.innerHTML = b.innerHTML; q.classList.remove('q'); anim(q, 'popin'); }
  if (!(await say(yes)) || g !== scene || tok !== TH.tok) return;
  await sleep(700); thRound(g);
}

  try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) {}

    fetch('sounds/' + id + '.mp3').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((res, rej) => c.decodeAudioData(ab, res, rej)))
      .then(buf => { SND.buf[id] = buf; }).catch(() => { SND.fails.push(id); });

  stopAnimalSound();
  const c = ac(), b = SND.buf[id];
  SND.log.push(id + (b ? ':real' : ':synth'));

    const s = c.createBufferSource(); s.buffer = b; s.connect(MASTER); s.start(); SND.src = s;
    return new Promise(r => { let done = false; const fin = () => { if (!done) { done = true; r(); } }; s.onended = fin; setTimeout(fin, b.duration * 1000 + 120); });

/* ---------- 12. offline: a service worker keeps the game + English voices (sw.js) ---------- */
const V14_MEDIA = 'bbe-media-1';
async function v14OfflineStatus() {
  const s = $('#v14offs'); if (!s) return;
  try { const c = await caches.open(V14_MEDIA), n = (await c.keys()).filter(r => /\/voice\/en\//.test(r.url)).length, all = VO.man.en ? VO.man.en.size : 0; s.textContent = `Saved: ${n} of ${all} English voice files.`; } catch (e) { s.textContent = ''; }
}
async function v14OfflineSave(btn) {
  const s = $('#v14offs'); btn.disabled = true;
  try {
    const app = await caches.open('bbe-app-v14'); await app.addAll(['./', 'index.html']).catch(() => {});
    const c = await caches.open(V14_MEDIA), have = new Set((await c.keys()).map(r => r.url));
    const urls = [...(VO.man.en || [])].map(h => new URL('sounds/voice/en/' + h + '.mp3', location.href).href).concat(Object.keys(ANIMALS).filter(id => ANIMALS[id][2]).map(id => new URL('sounds/' + id + '.mp3', location.href).href)).filter(u => !have.has(u));
    let done = 0, fail = 0; const tot = urls.length;
    const work = async () => { while (urls.length) { const u = urls.shift(); try { const r = await fetch(u); if (r.ok) await c.put(u, r); else fail++; } catch (e) { fail++; } done++; if (s && done % 20 === 0) s.textContent = `Saving… ${done} / ${tot}`; } };
    await Promise.all([work(), work(), work(), work(), work(), work()]);
    if (s) s.textContent = fail ? `Saved, but ${fail} files failed. Try again on Wi-Fi.` : 'All English voices are saved on this device.';
  } catch (e) { if (s) s.textContent = 'Could not save: ' + e.message; }
  btn.disabled = false; setTimeout(v14OfflineStatus, 1500);
}

// Home: short tap = activity menu (same language). Hold 2 s = parent: back to language picker.
document.querySelectorAll('.home').forEach(h => {
  let timer = null, fired = false, down = false;
  h.addEventListener('pointerdown', e => { e.preventDefault(); down = true; fired = false; h.classList.add('holding');
    timer = setTimeout(() => { fired = true; h.classList.remove('holding'); goLang(); }, 2000); });
  const end = (go) => { if (!down) return; down = false; clearTimeout(timer); h.classList.remove('holding'); if (go && !fired) { if (mode) { SFX.pop(); goMenu(); } else if (MENU.cat && $('#menu').classList.contains('on')) { SFX.pop(); MENU.cat = MENU.back || null; MENU.back = null; goMenu(); } } };
  h.addEventListener('pointerup', () => end(true));
  h.addEventListener('pointerleave', () => end(false));
  h.addEventListener('pointercancel', () => end(false));
  h.addEventListener('contextmenu', e => e.preventDefault());
});
document.querySelectorAll('.speak').forEach(s => tap(s, () => { anim(s, 'bounce'); stopSpeech(); if (repeatFn) repeatFn(); }));
// toddler-proofing: no scrolling, pinch, double-tap zoom, long-press menus
document.addEventListener('touchmove', e => { const t = e.target; if (t && t.closest && (t.closest('.progbox') || t.closest('.v14pbody'))) return; e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => { const t = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement); if (!(t && t.closest && t.closest('input'))) e.preventDefault(); });
document.addEventListener('touchstart', () => {}, { passive: true });
['touchend', 'click'].forEach(ev => document.addEventListener(ev, () => { if (AC && AC.state === 'suspended') AC.resume(); }, { passive: true }));
window.addEventListener('pagehide', () => stopSpeech());
document.addEventListener('visibilitychange', () => { if (document.hidden) stopSpeech(); });
// parent settings (child's name/age, used only by Talk with Bear)
(function settings() {
  const p = $('#setp'), inp = $('#kname');
  const sync = () => { inp.value = KID.name; document.querySelectorAll('.agb').forEach(b => b.classList.toggle('on', +b.dataset.a === KID.age)); };
  $('#psett').addEventListener('click', () => { sync(); p.classList.add('on'); });
  document.querySelectorAll('.agb').forEach(b => b.addEventListener('click', () => { try { localStorage.setItem('kg_age', b.dataset.a); } catch (e) {} sync(); }));
  const save = () => { try { localStorage.setItem('kg_name', inp.value.trim().slice(0, 20)); } catch (e) {} };
  inp.addEventListener('input', save);
  $('#setok').addEventListener('click', () => { save(); inp.blur(); p.classList.remove('on'); });
  $('#progbtn').addEventListener('click', () => { save(); inp.blur(); openProgress(); });
})();
(function check4() { // English extras
  const known = new Set([...MODES, 'numpad', 'rhymes', 'bear', 'think', 'farm', 'pets', 'zoo', 'face', 'body', 'classroom', 'house']);
  for (const c of EN.menu) for (const m of c.modes) { if (!known.has(m)) console.error('menu mode', m); if (!EN.modes[m]) console.error('no EN name', m); }
  for (const m of MODES) if (!EN.menu.some(c => c.modes.includes(m))) console.error('mode not in any category', m);
  for (const r of EN.rhymes.list) for (const l of r.lines) { try { parseNotes(l.n); } catch (e) { console.error('rhyme', r.id, e.message); } }
  for (const k in LANGS) { const P = LANGS[k];
    for (const id in ANIMALS) if (!P.an || !P.an.names[id]) console.error('animal name', k, id);
    for (const m of (P.extraModes || [])) if (!P.modes[m]) console.error('mode name', k, m);
    if (k !== 'en' && (P.face || P.school || P.house || P.body && P.body.missing)) console.error('English topic leaked into', k); }
  for (const id in SCHOOL) if (!EN.school.names[id]) console.error('school word', id);
  for (const id in THINGS) if (!EN.house.things[id]) console.error('house word', id);
  for (const r in ROOMS) if (!EN.house.rooms[r]) console.error('room', r);
  for (const t in PUT) for (const r of PUT[t]) if (!ROOMS[r]) console.error('put', t, r);
  for (const k in MISSING) for (const p of MISSING[k]) if (!EN.body.names[p]) console.error('missing part', p);
  for (const k in LANGS) if (k !== 'en' && (LANGS[k].menu || LANGS[k].bear)) console.error('extras leaked into', k);
})();
// sanity check: every language pack has every word
(function check5() { // v8 Car World: English only, every word has an English name
  for (const m of EN.carWorld.modes) if (!EN.modes[m]) console.error('cw mode name', m);
  for (const k in LANGS) if (k !== 'en' && (LANGS[k].cw || LANGS[k].carWorld)) console.error('Car World leaked into', k);
  for (const c of CW_CATS) for (const [id] of CWV[c]) { if (c === 'colours' || c === 'numbers') continue; if (c === 'family' ? !EN.cw.fam[id] : !EN.cw.w[id]) console.error('cw word', c, id); }
  for (const id of CW_COUNT_NOUNS) if (!EN.cw.w[id] || !CW_PIC[id]) console.error('cw count noun', id);
  for (const [id] of STICKERS) if (!(id.startsWith('a_') ? EN.an.names[id.slice(2)] : EN.cw.stickers.names[id])) console.error('sticker name', id);
})();
(function check6() { // v9 Play Island: English only, every game and word has English text
  for (const k in LANGS) if (k !== 'en' && (LANGS[k].island || LANGS[k].pi)) console.error('Play Island leaked into', k);
  for (const m of PI_GAMES) if (!EN.modes[m]) console.error('pi mode name', m);
  for (const [id, kind] of PI_PEDS) { if (!PIPED[id]) console.error('pedestal art', id); if (kind === 'cat' && !EN.pi.ped[id]) console.error('pedestal name', id); }
  for (const id in PIF) if (!EN.pi.food[id]) console.error('food word', id);
  for (const s in SC_SCENES) for (const [id] of SC_SCENES[s].spots) { if (!EN.pi.things[id]) console.error('scene word', id); if (!PIS[id]) console.error('scene art', id); }
  for (const k of DS_TYPES.concat(['glasses'])) if (!EN.pi.clothes[k] || !PICL[k]) console.error('clothes', k);
  for (const k in PI_SHAPES) if (!EN.pi.shapes[k]) console.error('shape word', k);
  for (const k in ES_OBJ) if (!EN.pi.paint[k]) console.error('paint word', k);
  for (const id of TR_UP.concat(TR_DOWN)) { if (!PIFACE[id]) console.error('face', id); if (!EN.an.names[id] || !EN.an.says[id]) console.error('tree animal', id); if (!ANIMALS[id] || !ANIMALS[id][2]) console.error('no recording', id); }
})();
(function check2() { for (const k in LANGS) { const P = LANGS[k];
  for (const m of MODES) if (!P.modes[m]) console.error('missing mode', k, m);
  if (P.draw.colors.length !== 8 || P.draw.sizes.length !== 3) console.error('draw data', k);
  for (const sh in SHAPES) if (!P.puzzle.names[sh]) console.error('shape', k, sh);
  for (const it of SHOP_ITEMS) { if (/undefined/.test(P.shop.ask(it[0], it[1]) + P.shop.bought(it[0]))) console.error('shop', k, it[0]); } } })();
(function check3() { for (const k in LANGS) { const A = LANGS[k].abc, Lsave = L;
  for (const l of A.letters) { if (!l.say) console.error('no letter name', k, l.ch);
    for (const [w] of l.words) if (!abcMatch(w, l)) console.error('word does not match letter', k, l.ch, w); } } })();
(function check() { for (const k in LANGS) for (const c in VOCAB) for (const [id] of VOCAB[c]) if (!LANGS[k].words[id]) console.error('missing word', k, id); })();
</script>
