<title>Beep Beep 123</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}
body{font-family:"Arial Rounded MT Bold","Avenir Next",-apple-system,system-ui,"PingFang HK","Noto Sans CJK TC",sans-serif;color:#24344d;
 background:linear-gradient(180deg,#7fd0ff 0%,#d6f3ff 72%,#a5e887 72%,#7cd65a 100%)}
button{font:inherit;border:0;margin:0;padding:0;background:none;color:inherit;cursor:pointer;outline:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;
 padding:calc(env(safe-area-inset-top) + 2vmin) calc(env(safe-area-inset-right) + 2vmin) calc(env(safe-area-inset-bottom) + 2vmin) calc(env(safe-area-inset-left) + 2vmin)}
.screen.on{display:flex}
.big{border-radius:5vmin;box-shadow:0 1.2vmin 0 rgba(0,0,0,.18);transition:transform .1s}
.big:active{transform:translateY(.6vmin) scale(.97)}
/* language picker */
#lang{justify-content:center;align-items:center;gap:4vmin}
#lang .logo{font-size:11vmin;line-height:1}
.langs{display:flex;gap:4vmin;justify-content:center;align-items:center}
.langbtn{width:min(29vw,46vmin);height:min(40vh,42vmin);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;color:#fff;text-shadow:0 .4vmin 0 rgba(0,0,0,.25)}
.langbtn .flag{font-size:14vmin;line-height:1}
.langbtn .lbl{font-size:6.5vmin;font-weight:900}
.l-en{background:#ff6b6b}.l-ru{background:#4dabf7}.l-yue{background:#f59f00}
@media (orientation:portrait){.langs{flex-direction:column}.langbtn{width:72vw;height:22vh;flex-direction:row;gap:5vw}}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;height:12vmin;flex:none}
.round{width:11vmin;height:11vmin;border-radius:50%;background:#fff;font-size:6.5vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 .8vmin 0 rgba(0,0,0,.15);position:relative}
.ttl{font-size:5vmin;font-weight:900;color:#fff;text-shadow:0 .4vmin 0 rgba(0,0,0,.25);text-align:center;flex:1}
.home svg.ring{position:absolute;inset:-1vmin;width:13vmin;height:13vmin;pointer-events:none;transform:rotate(-90deg)}
.home svg.ring circle{fill:none;stroke:#ff6b6b;stroke-width:6;stroke-dasharray:283;stroke-dashoffset:283;transition:none}
.home.holding svg.ring circle{stroke-dashoffset:0;transition:stroke-dashoffset 2s linear}
/* menu */
.tiles{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3vmin;padding:2vmin;min-height:0}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;min-height:0;overflow:hidden}
.tile .pic{font-size:14vmin;line-height:1;height:20vmin;display:flex;align-items:flex-end;gap:1vmin}
.tile .pic svg{height:100%;width:auto}
.tile .lbl{font-size:4.6vmin;font-weight:900;color:#fff;text-shadow:0 .4vmin 0 rgba(0,0,0,.25)}
.t-count{background:#ff8787}.t-blocks{background:#69db7c}.t-find{background:#748ffc}.t-song{background:#ffa94d}
/* game */
#stage{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.q{font-size:6vmin;font-weight:900;text-align:center;padding:1vmin 2vmin;color:#fff;text-shadow:0 .5vmin 0 rgba(0,0,0,.25);flex:none}
.cars{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2vmin 3vmin;min-height:0;padding:1vmin}
.carbtn{width:var(--cw);position:relative;transition:transform .2s}
.carbtn svg{width:100%;display:block;pointer-events:none}
.carbtn.lit{transform:scale(1.12) translateY(-1vmin)}
.carbtn.lit svg{filter:drop-shadow(0 0 1.6vmin #fff700)}
.badge{position:absolute;left:50%;top:-4vmin;transform:translateX(-50%) scale(0);width:8vmin;height:8vmin;border-radius:50%;background:#fff;color:#e8590c;font-size:5.5vmin;font-weight:900;display:flex;align-items:center;justify-content:center;transition:transform .2s;box-shadow:0 .5vmin 0 rgba(0,0,0,.2)}
.carbtn.lit .badge{transform:translateX(-50%) scale(1)}
.choices{display:flex;justify-content:center;gap:5vmin;padding:2vmin 2vmin 3vmin;flex:none}
.choice{width:22vmin;height:22vmin;font-size:15vmin;font-weight:900;color:#fff;text-shadow:0 .6vmin 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.right{box-shadow:0 0 0 1.5vmin #fff700,0 1.2vmin 0 rgba(0,0,0,.18)!important}
.opts{flex:1;display:flex;gap:4vmin;justify-content:center;align-content:center;align-items:center;flex-wrap:wrap;min-height:0}
.card{--s:min(28vw,40vh);width:var(--s);height:var(--s);background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.6);line-height:1}
.card svg{width:88%;pointer-events:none}
.card .emo{pointer-events:none}
@media (orientation:portrait){.card{--s:min(42vw,27vh)}}
/* blocks */
.bjoin{flex:1.25;display:flex;align-items:stretch;justify-content:center;gap:2vmin;min-height:0;background:rgba(255,255,255,.35);border-radius:4vmin;padding:2vmin 2vmin 1vmin}
.slot{width:15vmin;display:flex;align-items:flex-end;justify-content:center;position:relative}
.slot svg{height:100%;width:auto;max-width:100%}
.slot.empty::after{content:"";position:absolute;left:1vmin;right:1vmin;bottom:0;height:12vmin;border:.8vmin dashed rgba(255,255,255,.9);border-radius:2vmin}
.op{font-size:10vmin;font-weight:900;color:#fff;text-shadow:0 .5vmin 0 rgba(0,0,0,.25);align-self:center}
.bshelf{flex:1;display:flex;justify-content:space-evenly;align-items:stretch;min-height:0;padding-top:2vmin}
.fbtn{display:flex;align-items:flex-end;justify-content:center;flex:1;min-width:0}
.fbtn svg{height:100%;width:auto;max-width:100%;pointer-events:none}
/* song */
.lyrics{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2vmin;text-align:center;min-height:0}
.line{font-size:5vmin;font-weight:900;color:#fff;opacity:.6;text-shadow:0 .4vmin 0 rgba(0,0,0,.25);transition:all .3s}
.line.now{opacity:1;font-size:7vmin;color:#fff3bf}
.road{height:26vmin;flex:none;background:#585f66;border-radius:3vmin;position:relative;overflow:hidden;border-top:1.2vmin solid #ced4da}
.road::after{content:"";position:absolute;left:0;right:0;top:50%;height:1vmin;background:repeating-linear-gradient(90deg,#fff 0 6vmin,transparent 6vmin 11vmin);opacity:.7}
.lane{position:absolute;inset:1vmin 2vmin 3vmin;display:flex;align-items:flex-end;justify-content:center;gap:1vmin;z-index:1}
.lane .scar{width:min(11vmin,8.6vw);animation:drivein .8s ease-out both,bob .6s ease-in-out .8s infinite}
.lane .scar svg{width:100%;pointer-events:none;display:block}
.play{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:26vmin;height:26vmin;border-radius:50%;background:#ff6b6b;color:#fff;font-size:13vmin;display:flex;align-items:center;justify-content:center;z-index:2}
.play:active{transform:translate(-50%,-48%) scale(.96)}
@keyframes drivein{from{transform:translateX(-80vw)}to{transform:translateX(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.8vmin)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
.wiggle{animation:wiggle .5s}.bounce{animation:bounce .45s}.popin{animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf{position:absolute;line-height:1}
#note{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 1vmin);transform:translateX(-50%);max-width:90vw;font-size:2.3vmin;background:rgba(255,255,255,.9);color:#495057;border-radius:1.5vmin;padding:.8vmin 1.6vmin;display:none;z-index:40;text-align:center}
/* menu with 7 tiles */
.tiles{grid-template-columns:repeat(4,1fr)!important;grid-template-rows:1fr 1fr!important;gap:2.4vmin!important}
@media (orientation:portrait){.tiles{grid-template-columns:repeat(2,1fr)!important;grid-template-rows:repeat(4,1fr)!important}}
.tile .pic{font-size:10vmin!important;height:13vmin!important;max-width:96%;justify-content:center;align-items:center!important}
.tile .pic svg{flex:0 1 auto;min-width:0;max-height:100%}
.tile .lbl{font-size:3.7vmin!important;text-align:center;padding:0 1vmin;line-height:1.1}
.t-draw{background:#f783ac}.t-puzzle{background:#38d9a9}.t-shop{background:#4dabf7}
/* drawing */
.draw{flex:1;display:flex;gap:2vmin;min-height:0}
.canwrap{flex:1;order:2;position:relative;background:#fff;border-radius:3vmin;overflow:hidden;min-width:0;min-height:0;box-shadow:0 1vmin 0 rgba(0,0,0,.15)}
.canwrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#tv{pointer-events:none}
.pal{display:grid;grid-template-columns:repeat(2,10vmin);grid-auto-rows:10vmin;gap:1.4vmin;align-content:center;flex:none}
.pcol{order:1}.ptool{order:3}
.sw{border-radius:50%;border:.8vmin solid #fff;box-shadow:0 .6vmin 0 rgba(0,0,0,.2);transition:transform .15s}
.sw.on{transform:scale(1.12);box-shadow:0 0 0 .7vmin #343a40}
.tool{background:#fff;border-radius:2.5vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 .6vmin 0 rgba(0,0,0,.18);font-size:6vmin;font-weight:900;color:#495057;overflow:hidden}
.tool.on{box-shadow:0 0 0 .7vmin #ff922b}
.tool svg{width:80%;height:80%;pointer-events:none}
.dot{border-radius:50%;display:block;pointer-events:none}
@media (orientation:portrait){.draw{flex-direction:column}.canwrap{order:1}
 .pal{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:8.6vmin;grid-template-rows:8.6vmin;justify-content:center}}
/* puzzles */
.pzbar{display:flex;justify-content:center;gap:4vmin;flex:none;padding-bottom:1.5vmin}
.sub{width:16vmin;height:10vmin;background:#fff;font-size:7vmin;display:flex;align-items:center;justify-content:center}
.sub svg{height:7.5vmin;width:auto;pointer-events:none}
.sub.on{box-shadow:0 0 0 1vmin #fff700,0 1.2vmin 0 rgba(0,0,0,.18)}
.pzarea{flex:1;position:relative;min-height:0}
.board{position:absolute;background:rgba(255,255,255,.55);border-radius:2vmin;overflow:hidden}
.board .ghost{position:absolute;inset:0;opacity:.28}
.board .ghost svg{width:100%;height:100%;display:block}
.slotz{position:absolute;border:.4vmin dashed rgba(0,0,0,.3)}
.piece{position:absolute;overflow:hidden;border-radius:1.5vmin;box-shadow:0 1vmin 2vmin rgba(0,0,0,.3);outline:.5vmin solid #fff;touch-action:none;z-index:5}
.piece svg{position:absolute;display:block;pointer-events:none}
.piece.locked{box-shadow:none;outline:none;border-radius:0;z-index:1}
.dragging{z-index:30!important}
.hole,.shp{position:absolute}
.hole svg,.shp svg{width:100%;height:100%;display:block;pointer-events:none}
.shp{touch-action:none;z-index:5;filter:drop-shadow(0 .8vmin 0 rgba(0,0,0,.2))}
.shp.locked{z-index:2;filter:none}
.back{transition:left .35s ease,top .35s ease}
/* shop */
.shop{flex:1;display:flex;flex-direction:column;gap:1.6vmin;min-height:0}
.srow{display:flex;align-items:center;justify-content:space-between;flex:1;min-height:0;gap:2vmin}
.lvls{display:flex;flex-direction:column;gap:2vmin}
.lvl{width:16vmin;height:11vmin;background:#fff;display:flex;align-items:center;justify-content:center;gap:.3vmin}
.lvl svg{height:7vmin;width:7vmin;pointer-events:none}
.lvl.on{box-shadow:0 0 0 1vmin #fff700,0 1.2vmin 0 rgba(0,0,0,.18)}
.item{position:relative;background:#fff;border-radius:5vmin;padding:1.5vmin 4vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 1.2vmin 0 rgba(0,0,0,.15)}
.iemo{font-size:16vmin;line-height:1;width:24vmin;height:18vmin;display:flex;align-items:center;justify-content:center}
.iemo svg{width:100%}
.tag{position:absolute;right:-3vmin;top:-2.5vmin;background:#ff6b6b;color:#fff;font-size:7vmin;font-weight:900;border-radius:3vmin;padding:.4vmin 2.4vmin;transform:rotate(8deg);box-shadow:0 .6vmin 0 rgba(0,0,0,.2)}
.basket{width:22vmin;height:19vmin;position:relative}
.basket svg.bk{position:absolute;inset:0;width:100%;height:100%}
.bitems{position:absolute;left:12%;right:12%;top:2%;height:46%;display:flex;flex-wrap:wrap-reverse;justify-content:center;align-content:flex-start;font-size:5vmin;line-height:1}
.bitems svg{width:7vmin}
.pdots{display:flex;justify-content:center;gap:1.2vmin;flex:none;flex-wrap:wrap}
.pd{width:5.5vmin;height:5.5vmin;border-radius:50%;border:.7vmin solid #fff;background:rgba(255,255,255,.3);transition:background .2s,transform .2s}
.pd.on{background:#ffd43b;transform:scale(1.1)}
.till{flex:none;min-height:16vmin;background:#a1887f;border:.9vmin solid #6d4c41;border-radius:3vmin;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1vmin;padding:1vmin}
.tcoin{width:13vmin;height:13vmin}
.tcoin svg,.pcoin svg{width:100%;height:100%;pointer-events:none}
.purse{display:flex;justify-content:center;align-items:center;gap:4vmin;flex:none;padding-bottom:1vmin}
.pcoin{width:16vmin;height:16vmin;border-radius:50%}
.fly{position:fixed;z-index:60;pointer-events:none;font-size:16vmin;line-height:1}
.fly svg{width:24vmin}
/* 9 tiles: 3 x 3 in both orientations */
.tiles{grid-template-columns:repeat(3,1fr)!important;grid-template-rows:repeat(3,1fr)!important;gap:2vmin!important}
.t-lmatch{background:#ff922b}.t-lfind{background:#9775fa}
.tl{font-weight:900;color:#fff;text-shadow:0 .5vmin 0 rgba(0,0,0,.25);line-height:1}
/* letter match */
.lm{flex:1;display:flex;gap:3vmin;min-height:0;align-items:stretch}
.lpanel{flex:0 0 36%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;background:rgba(255,255,255,.35);border-radius:4vmin;padding:2vmin;min-width:0}
.lrow{display:flex;align-items:center;gap:2vmin}
.arw{width:10vmin;height:10vmin;border-radius:50%;background:#fff;font-size:5vmin;color:#495057;box-shadow:0 .6vmin 0 rgba(0,0,0,.15);flex:none}
.bigl{min-width:24vmin;height:24vmin;padding:0 2vmin;border-radius:5vmin;background:#fff;font-size:16vmin;font-weight:900;line-height:1;box-shadow:0 1.2vmin 0 rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}
.bigl.small{min-width:14vmin;height:14vmin;font-size:10vmin;border-radius:3.5vmin}
.lq{font-size:4.2vmin;font-weight:900;color:#fff;text-shadow:0 .4vmin 0 rgba(0,0,0,.25);text-align:center}
.lgot{display:flex;flex-wrap:wrap;justify-content:center;gap:1vmin;font-size:7vmin;min-height:8vmin;line-height:1}
.lcards{flex:1;display:flex;flex-wrap:wrap;gap:3vmin;justify-content:center;align-content:center;min-width:0;min-height:0}
.lcard{--s:min(25vw,37vh);width:var(--s);height:var(--s);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;touch-action:none;z-index:2}
.lcard .emo{font-size:calc(var(--s)*.5);line-height:1.15;pointer-events:none}
.lcard .wl{font-size:calc(var(--s)*.13);font-weight:900;color:#495057;pointer-events:none}
.wl b{color:#e03131}
.lcard.done{opacity:.55}
@media (orientation:portrait){.lm{flex-direction:column}.lpanel{flex:0 0 auto}.lcard{--s:min(40vw,25vh)}}
/* find the letter */
.lfbar{display:flex;justify-content:center;align-items:center;gap:3vmin;flex:none}
.lfq{padding:.5vmin}
.lfarea{flex:1;position:relative;min-height:0;overflow:hidden}
.fl{position:absolute;left:0;top:0;border-radius:50%;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1;touch-action:none;will-change:transform;box-shadow:0 .5vmin 0 rgba(0,0,0,.08)}

@keyframes popout{to{transform:scale(1.9);opacity:0}}
/* letter picker */
.picker{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,10vmin);gap:1.5vmin;width:88vw;justify-content:center}
.pk{width:10vmin;height:10vmin;font-size:6.5vmin;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;text-shadow:0 .4vmin 0 rgba(0,0,0,.25)}

/* category menus (English) */

@media (orientation:portrait){.tiles.subm{grid-template-columns:repeat(2,1fr)!important}}
.t-numpad{background:#20c997}.t-rhymes{background:#f06595}.t-bear{background:#c0835a}.t-think{background:#5c7cfa}.t-body{background:#ff922b}.t-animals{background:#51cf66}

const SP = { voice: null, canSpeak: true, gen: 0 };

  let vs = []; try { vs = speechSynthesis.getVoices() || []; } catch (e) {}
  if (!vs.length) { SP.voice = null; SP.canSpeak = true; showNote(false); return; } // list not loaded yet: let the OS choose by lang code

    if (idx < 0) continue;

    const g = SP.gen; let done = false, to;

    const per = L.key === 'yue' ? 230 : 75;

let ZTOP = 10;

    if (id !== null || el.dataset.locked) return;
    e.preventDefault(); ac(); id = e.pointerId;
